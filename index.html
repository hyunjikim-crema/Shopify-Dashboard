        const parseCSVLine = (text) => {

            const result = []; let cell = ''; let inQuotes = false;

            for (let i = 0; i < text.length; i++) {

                const char = text[i];

                if (char === '"') inQuotes = !inQuotes;

                else if (char === ',' && !inQuotes) { result.push(cell); cell = ''; }

                else cell += char;

            }

            result.push(cell); return result;

        };



        const MetricCard = ({ title, value, subtext, icon: IconComponent, trend, customTrend }) => (

            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">

                <div className="flex justify-between items-start mb-4">

                    <div className="p-2 bg-indigo-50 rounded-lg">

                        {IconComponent && <IconComponent className="w-6 h-6 text-indigo-600" />}

                    </div>

                    {customTrend ? customTrend : (trend !== null && trend !== undefined && !isNaN(trend) && trend !== 0 && (

                        <span className={`flex items-center text-sm font-medium ${trend >= 0 ? 'text-green-600' : 'text-red-600'}`}>

        // (툴팁 컴포넌트 생략 - 이전과 동일하여 코드 길이 최적화)

        const ViewModeSelector = ({ mode, setMode }) => (

            <div className="flex bg-slate-100 p-1 rounded-xl">

                {['daily', 'weekly', 'monthly'].map((m) => (

                    <button key={m} onClick={() => setMode(m)} className={`px-3 py-1.5 rounded-lg text-[11px] font-bold transition-all ${mode === m ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>

                        {m === 'daily' ? '일간' : m === 'weekly' ? '주간' : '월간'}

                    </button>

        );



        const DraggableChartContainer = ({ children, dataLength, mode }) => {

            const scrollRef = useRef(null);

            const [isDragging, setIsDragging] = useState(false);

            const [startX, setStartX] = useState(0);

            const [scrollLeft, setScrollLeft] = useState(0);

            const onMouseDown = e => { setIsDragging(true); setStartX(e.pageX - scrollRef.current.offsetLeft); setScrollLeft(scrollRef.current.scrollLeft); };

            const onMouseLeave = () => setIsDragging(false); const onMouseUp = () => setIsDragging(false);

            const onMouseMove = e => { if (!isDragging) return; e.preventDefault(); const x = e.pageX - scrollRef.current.offsetLeft; const walk = (x - startX) * 1.5; scrollRef.current.scrollLeft = scrollLeft - walk; };

            const itemWidth = mode === 'daily' ? 40 : mode === 'weekly' ? 60 : 80;

            const minWidth = Math.max(0, dataLength * itemWidth);

            return (

                <div ref={scrollRef} className={`w-full h-full overflow-x-auto overflow-y-hidden select-none hide-scroll ${isDragging ? 'cursor-grabbing' : 'cursor-grab'}`} onMouseDown={onMouseDown} onMouseLeave={onMouseLeave} onMouseUp={onMouseUp} onMouseMove={onMouseMove}>

                    <div style={{ minWidth: minWidth > 0 ? `${minWidth}px` : '100%', height: '100%' }}>{children}</div>

                </div>

            );

        };



        function App() {

            // 사용자 및 파이어베이스 설정

            const [user, setUser] = useState(null);

            const [cloudStatus, setCloudStatus] = useState('initializing'); // initializing, local, connected, error

            const [dbInstance, setDbInstance] = useState(null);

            const [appIdStr, setAppIdStr] = useState('global_shopify_dashboard_v2');



            // 데이터 상태

            const [rawOnboardingRows, setRawOnboardingRows] = useState([]);

            const [filterStartDate, setFilterStartDate] = useState('');

            const [filterEndDate, setFilterEndDate] = useState('');

            const [dailyStats, setDailyStats] = useState([]);

            const [weeklyData, setWeeklyData] = useState([]);

            const [monthlyStats, setMonthlyStats] = useState([]);

            const [compStats, setCompStats] = useState([]);

            const [countryStats, setCountryStats] = useState([]);

            const [churnStats, setChurnStats] = useState([]);

            const [planData, setPlanData] = useState([]);

            

            const [totalPaidUsers, setTotalPaidUsers] = useState(0);

            const [paidAdded, setPaidAdded] = useState(0);

            const [paidCancelled, setPaidCancelled] = useState(0);

            const [hasOnboardingData, setHasOnboardingData] = useState(false);

            const [hasPaymentData, setHasPaymentData] = useState(false);

            const [isSyncing, setIsSyncing] = useState(false);



            const [trendViewMode, setTrendViewMode] = useState('weekly');

            const [earlyChurnViewMode, setEarlyChurnViewMode] = useState('weekly');

            const [onboardingViewMode, setOnboardingViewMode] = useState('weekly');

            const [summaryViewMode, setSummaryViewMode] = useState('monthly');

            const [cohortFocus, setCohortFocus] = useState(null);



            const fileInputRef = useRef(null);



            useEffect(() => {

                // 1. 앱 진입 즉시 로컬 캐시에서 데이터를 불러와 새로고침 방어

                const cachedOnboarding = localStorage.getItem('shopify_dashboard_onboarding');

                const cachedPayment = localStorage.getItem('shopify_dashboard_payment');

                if (cachedOnboarding) processOnboardingData(cachedOnboarding, false);

                if (cachedPayment) processPaymentData(cachedPayment, false);



                // 2. 파이어베이스 모듈 확인

                if (!window.FirebaseAPI) {

                    setCloudStatus('local');

                    return;

                }

                const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore } = window.FirebaseAPI;



                // 3. 설정 확인 (커스텀 설정 우선, 그다음 제미나이 환경 변수)

                let configToUse = null;

                if (MY_FIREBASE_CONFIG && MY_FIREBASE_CONFIG.apiKey) {

                    configToUse = MY_FIREBASE_CONFIG;

                } else if (typeof window.__firebase_config !== 'undefined') {

                    try {

                        configToUse = typeof window.__firebase_config === 'string' ? JSON.parse(window.__firebase_config) : window.__firebase_config;

                    } catch(e) {}

                }



                if (!configToUse || !configToUse.apiKey) {

                    // Vercel 등 외부 환경에서 커스텀 설정이 없는 경우

                    setCloudStatus('local');

                    return;

                }



                try {

                    const fbApp = initializeApp(configToUse);

                    const fbAuth = getAuth(fbApp);

                    const fbDb = getFirestore(fbApp);

                    setDbInstance(fbDb);



                    const finalAppId = (typeof window.__app_id !== 'undefined' && window.__app_id) ? window.__app_id : 'global_shopify_dashboard_v2';

                    setAppIdStr(finalAppId);



                    const doAuth = async () => {

                        try {

                            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {

                                await signInWithCustomToken(fbAuth, window.__initial_auth_token);

                            } else {

                                await signInAnonymously(fbAuth);

                            }

                        } catch (err) {

                            console.error("Firebase Auth Error:", err);

                            setCloudStatus('error');

                        }

                    };

                    

                    doAuth();

                    const unsubscribe = onAuthStateChanged(fbAuth, (u) => {

                        setUser(u);

                        if(u) setCloudStatus('connected');

                    });

                    return () => unsubscribe();

                } catch (err) {

                    console.error("Firebase Init Error:", err);

                    setCloudStatus('error');

                }

            }, []);



            useEffect(() => {

                if (cloudStatus !== 'connected' || !user || !dbInstance || !window.FirebaseAPI) return;

                const { doc, onSnapshot } = window.FirebaseAPI;

                

                const dataDocRef = doc(dbInstance, 'artifacts', appIdStr, 'public', 'data', 'csv_data', 'latest');

                

                setIsSyncing(true);

                const unsubscribe = onSnapshot(dataDocRef, (docSnap) => {

                    if (docSnap.exists()) {

                        const data = docSnap.data();

                        if (data.onboardingCsv) {

                            localStorage.setItem('shopify_dashboard_onboarding', data.onboardingCsv);

                            processOnboardingData(data.onboardingCsv, false);

                        }

                        if (data.paymentCsv) {

                            localStorage.setItem('shopify_dashboard_payment', data.paymentCsv);

                            processPaymentData(data.paymentCsv, false);

                        }

                    }

                    setIsSyncing(false);

                }, (error) => {

                    console.error("Firestore sync error:", error);

                    setCloudStatus('error');

                    setIsSyncing(false);

                });



                return () => unsubscribe();

            }, [cloudStatus, user, dbInstance, appIdStr]);



            const handleFileUpload = async (e) => {

                const file = e.target.files[0];

                if (!file) return;



                const reader = new FileReader();

                reader.onload = async (ev) => {

                    const text = ev.target.result;

                    

                    // 1. 무조건 로컬(localStorage)에 먼저 저장하여 새로고침 방어

                    if (text.includes('앱설치일')) {

                        localStorage.setItem('shopify_dashboard_onboarding', text);

                        processOnboardingData(text, true);

                    } else if (text.includes('신청 플랜')) {

                        localStorage.setItem('shopify_dashboard_payment', text);

                        processPaymentData(text, true);

                    } else {

                        alert("올바른 Shopify CSV 형식이 아닙니다.");

                        return;

                    }



                    // 2. 클라우드 연결 상태면 클라우드에도 전송

                    if (cloudStatus === 'connected' && user && dbInstance && window.FirebaseAPI) {

                        const { doc, setDoc } = window.FirebaseAPI;

                        try {

                            setIsSyncing(true);

                            const dataDocRef = doc(dbInstance, 'artifacts', appIdStr, 'public', 'data', 'csv_data', 'latest');

                            const payload = {};

                            if (text.includes('앱설치일')) payload.onboardingCsv = text;

                            if (text.includes('신청 플랜')) payload.paymentCsv = text;

                            

                            await setDoc(dataDocRef, payload, { merge: true });

                            setIsSyncing(false);

                        } catch (err) {

                            console.error("Cloud upload error:", err);

                            alert("클라우드 저장 실패! (파일이 너무 크거나 권한이 없습니다.)\n내 컴퓨터(로컬)에는 정상적으로 적용되었습니다.");

                            setIsSyncing(false);

                        }

                    }

                };

                reader.readAsText(file);

                e.target.value = null;

            };



            const processOnboardingData = (csvText, isNewUpload = false) => {

                try {

                    const lines = csvText.split('\n').filter(l => l.trim().length > 5);

                    if (lines.length < 1) return;

                    const headers = parseCSVLine(lines[0]);

                    const idxDate = headers.findIndex(h => h.trim().includes('앱설치일'));

                    const idxCountry = headers.findIndex(h => h.trim().includes('국가'));

                    const idxUn = headers.findIndex(h => h.trim().includes('앱 삭제'));

                    const idxCl = headers.findIndex(h => h.trim().includes('Store closed'));

                    const idxS1 = headers.findIndex(h => h.trim().startsWith('1)'));

                    const idxS2_1 = headers.findIndex(h => h.trim().startsWith('2-1)'));

                    const idxS2_2 = headers.findIndex(h => h.trim().startsWith('2-2)'));

                    const idxS2_3 = headers.findIndex(h => h.trim().startsWith('2-3)'));

                    const idxS3 = headers.findIndex(h => h.trim().startsWith('3)'));

                    const idxExp = headers.findIndex(h => h.trim().includes('위젯 노출여부'));

                    const idxChurn = headers.findIndex(h => h.trim().includes('이탈일'));

                    const idxPaid = headers.findIndex(h => h.trim().includes('유료 결제'));



                    const dateRegex = /(\d{4})[\.\-\/]\s*(\d{1,2})[\.\-\/]\s*(\d{1,2})/;

                    const rows = [];

                    lines.slice(1).forEach(line => {

                        const cols = parseCSVLine(line);

                        if (!cols[idxDate]) return;

                        const match = cols[idxDate].replace(/["']/g, '').trim().match(dateRegex);

                        if (!match) return;

                        const yr = Number(match[1]), mo = Number(match[2]), dy = Number(match[3]);

                        const dObj = new Date(yr, mo - 1, dy);

                        const dStr = `${yr}-${String(mo).padStart(2, '0')}-${String(dy).padStart(2, '0')}`;

                                            <XAxis dataKey="label" tick={{fontSize: 10, fontWeight: 600}} axisLine={false} tickLine={false} />

                                            <YAxis yAxisId="left" tick={{fontSize: 11}} axisLine={false} tickLine={false} />

                                            <YAxis yAxisId="right" orientation="right" tick={{fontSize: 10, fill: '#10b981'}} axisLine={false} tickLine={false} domain={[0, 100]} unit="%" />

                                            <Tooltip />

                                            <Legend iconType="circle" wrapperStyle={{paddingTop: '20px', fontSize: '11px'}} />

                                            <Bar yAxisId="left" dataKey="installs" name="신규 설치" fill="#818cf8" radius={[4, 4, 0, 0]} barSize={12}>

                                                <LabelList dataKey="installs" position="top" offset={5} style={{ fontSize: '10px', fill: '#4f46e5', fontWeight: 'bold' }} formatter={(v) => v > 0 ? v : ''} />

                                            </Bar>

                                            <Bar yAxisId="left" dataKey="paid" name="유료 결제" fill="#0ea5e9" radius={[4, 4, 0, 0]} barSize={12}>

                                                <LabelList dataKey="paid" position="top" offset={5} style={{ fontSize: '10px', fill: '#0284c7', fontWeight: 'bold' }} formatter={(v) => v > 0 ? v : ''} />

                                            </Bar>

                                            <Bar yAxisId="left" dataKey="uninstalls" name="앱 삭제" fill="#f87171" radius={[4, 4, 0, 0]} barSize={12} />

                                            <Bar yAxisId="left" dataKey="closed" name="폐업" fill="#eab308" radius={[4, 4, 0, 0]} barSize={12} />

                                            <Line yAxisId="right" type="monotone" dataKey="retentionRate" name="순 설치 유지율 (%)" stroke="#10b981" strokeWidth={2} strokeDasharray="4 4" dot={{r: 3, fill: '#10b981'}}>

                                                <LabelList dataKey="retentionRate" position="top" offset={8} style={{ fontSize: '10px', fill: '#059669', fontWeight: 'bold' }} formatter={(v) => v > 0 ? `${v}%` : ''} />

                                            </Line>

                                        </ComposedChart>

                                    </ResponsiveContainer>

                                </DraggableChartContainer>

                            </div>

                        </div>



                        {/* 2. 온보딩 단계별 완료율 */}

                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">

                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">

                                <h3 className="text-lg font-bold flex items-center text-slate-800">

                                    <span className="w-1.5 h-5 bg-indigo-500 rounded-full mr-3"></span>

                                    온보딩 단계별 완료율

                                </h3>

                                <ViewModeSelector mode={onboardingViewMode} setMode={setOnboardingViewMode} />

                            </div>

                            <div className="h-80 w-full relative">

                                <DraggableChartContainer dataLength={activeOnboardingData.length} mode={onboardingViewMode}>

                                    <ResponsiveContainer width="100%" height="100%">

                                        <LineChart data={activeOnboardingData} margin={{ left: -20, top: 10, right: 10 }}>

                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />

                                            <XAxis dataKey="label" tick={{fontSize: 11, fontWeight: 600}} axisLine={false} tickLine={false} />

                                            <YAxis domain={[0, 100]} tick={{fontSize: 11}} axisLine={false} tickLine={false} />

                                            <Tooltip />

                                            <Legend iconType="circle" wrapperStyle={{paddingTop: '20px', fontSize: '11px'}} />

                                            <Line type="monotone" dataKey="step1" name="1.정보 확인" stroke="#94a3b8" strokeDasharray="5 5" dot={false} strokeWidth={1.5} />

                                            <Line type="monotone" dataKey="step2_1" name="2-1.색상 선택" stroke="#818cf8" strokeWidth={1.5} dot={{r:2}} />

                                            <Line type="monotone" dataKey="step2_2" name="2-2.Core Snippet" stroke="#6366f1" strokeWidth={1.5} dot={{r:2}} />

                                            <Line type="monotone" dataKey="step2_3" name="2-3.위젯 설치" stroke="#4f46e5" strokeWidth={1.5} dot={{r:2}} />

                                            <Line type="monotone" dataKey="step3" name="3.완료" stroke="#10b981" strokeWidth={3} dot={true} />

                                            <Line type="monotone" dataKey="exposedRate" name="▶ 위젯 노출" stroke="#f59e0b" strokeWidth={2} dot={{r:4}} />

                                        </LineChart>

                                    </ResponsiveContainer>

                                </DraggableChartContainer>

                            </div>

                        </div>



                        {/* 4. 온보딩 단계별 개선 추이 (그룹별 비교) */}

                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">

                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">

                                <h3 className="text-lg font-bold flex items-center text-slate-900">

                                    <Zap className="w-5 h-5 text-amber-500 mr-3" fill="currentColor" />

                                    온보딩 단계별 개선 추이 (그룹별 비교)

                                </h3>

                                {cohortFocus && (

                                    <button onClick={() => setCohortFocus(null)} className="text-[10px] bg-slate-800 text-white px-2 py-1 rounded flex items-center hover:bg-slate-700 transition">

                                        <Filter className="w-3 h-3 mr-1" /> 필터 초기화

                                    </button>

                                )}

                            </div>

                            <div className="h-[450px]">

                                <ResponsiveContainer width="100%" height="100%">

                                    <BarChart data={cohortChartData} margin={{ top: 20, right: 30, left: -20, bottom: 5 }} barCategoryGap="25%" barGap={6}>

                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />

                                        <XAxis dataKey="name" tick={{fontSize: 11, fontWeight: 'bold', fill: '#475569'}} axisLine={false} tickLine={false} />

                                        <YAxis domain={[0, 100]} tick={{fontSize: 11}} axisLine={false} tickLine={false} unit="%" />

                                        <Tooltip />

                                        <Legend iconType="circle" wrapperStyle={{paddingTop: '20px', fontSize: '11px', fontWeight: 'bold'}} onClick={(e) => setCohortFocus(prev => prev === e.value ? null : e.value)} cursor="pointer" />

                                        {Object.entries(COHORT_COLORS).map(([name, color]) => (

                                            <Bar key={name} dataKey={name} fill={color} radius={[4, 4, 0, 0]} barSize={26} hide={cohortFocus && cohortFocus !== name} onClick={() => setCohortFocus(prev => prev === name ? null : name)} cursor="pointer">

                                                <LabelList dataKey={name} position="top" offset={5} style={{ fontSize: '9px', fill: color, fontWeight: 'bold' }} formatter={(v) => v > 0 ? `${v}%` : ''} />

                                            </Bar>

                                        ))}

                                    </BarChart>

                                </ResponsiveContainer>

                            </div>

                        </div>



                        {/* 5. 국가별 현황 */}

                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">

                            <h3 className="text-lg font-bold mb-6 flex items-center text-slate-800"><Globe className="w-5 h-5 text-blue-500 mr-3" />국가별 가입 규모 및 전환 현황</h3>

                            {countryStats && countryStats.length > 0 ? (

                                <div className="h-[480px]">

                                    <ResponsiveContainer width="100%" height="100%">

                                        <ComposedChart data={countryStats} margin={{ top: 10, right: 0, left: 0, bottom: 30 }}>

                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />

                                            <XAxis dataKey="country" tick={{fontSize: 11, fontWeight: 'bold', fill: '#475569'}} interval={0} angle={-30} textAnchor="end" height={60} />

                                            <YAxis yAxisId="left" tick={{fontSize: 11}} axisLine={false} tickLine={false} />

                                            <YAxis yAxisId="right" orientation="right" domain={[0, 100]} unit="%" tick={{fontSize: 11, fill: '#10b981'}} axisLine={false} tickLine={false} />

                                            <Tooltip />

                                            <Legend verticalAlign="top" align="right" iconType="circle" wrapperStyle={{ fontSize: '11px', fontWeight: 'bold', paddingBottom: '20px' }} />

                                            <Bar yAxisId="left" dataKey="newInstalls" name="전체 가입 수" fill="#e0e7ff" radius={[4, 4, 0, 0]} barSize={24} />

                                            <Bar yAxisId="left" dataKey="s3" name="온보딩 완료" fill="#818cf8" radius={[4, 4, 0, 0]} barSize={24} />

                                            <Line yAxisId="right" type="monotone" dataKey="retentionRate" name="순 설치 유지율 (%)" stroke="#10b981" strokeWidth={2} dot={{r: 4, fill: '#10b981'}} strokeDasharray="4 4" />

                                            <Line yAxisId="right" type="monotone" dataKey="onboardingRate" name="온보딩 완료율 (%)" stroke="#4338ca" strokeWidth={2} dot={{r: 3, fill: '#4338ca'}} strokeDasharray="4 4" />

                                        </ComposedChart>

                                    </ResponsiveContainer>

                                </div>

                            ) : <div className="h-64 flex items-center justify-center text-slate-400 font-sans">데이터가 없습니다.</div>}

                        </div>



                        {/* 6. 데이터 상세 요약 */}

                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 font-sans">

                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 font-sans">

                                <h3 className="text-lg font-bold flex items-center text-slate-800">

                                    <LayoutList className="w-5 h-5 text-indigo-500 mr-3" />

                                    데이터 상세 요약

                                </h3>

                                <ViewModeSelector mode={summaryViewMode} setMode={setSummaryViewMode} />

                            </div>

                            <div className="overflow-x-auto">

                                <table className="w-full text-xs text-center border-collapse text-[11px] font-sans">

                                    <thead className="text-slate-400 border-b font-bold uppercase tracking-tighter text-[10px]">

                                        <tr>

                                            <th className="text-left py-3 px-2">{summaryViewMode === 'daily' ? '일자' : summaryViewMode === 'weekly' ? '주차' : '월'}</th>

                                            <th className="px-2">신규 설치</th>

                                            <th className="px-2 text-red-400">삭제</th>

                                            <th className="px-2 text-yellow-500">폐업</th>

                                            <th className="px-2 text-indigo-600 font-black">순 설치 (잔존)</th>

                                            <th className="px-2 text-emerald-600 font-black">완료율 (%)</th>

                                            <th className="px-2 text-indigo-400 font-black">위젯 노출 (%)</th>

                                            <th className="px-2 text-green-700 font-black">유료 결제</th>

                                        </tr>

                                    </thead>

                                    <tbody className="divide-y font-medium text-slate-600 font-mono font-sans">

                                        {activeSummaryData && activeSummaryData.length > 0 ? activeSummaryData.map((r, i) => (

                                            <tr key={i} className="hover:bg-slate-50/50 transition">

                                                <td className="text-left py-4 px-2 font-bold text-slate-700 font-sans">{r.label}</td>

                                                <td className="px-2 font-mono">{r.newInstalls}</td>

                                                <td className="px-2 text-red-400 opacity-80 font-mono">{r.uninstalls}</td>

                                                <td className="px-2 text-yellow-500 opacity-80 font-mono">{r.storeClosed}</td>

                                                <td className="px-2 bg-indigo-50/20 text-indigo-600 font-black font-mono">{r.netInstalls}</td>

                                                <td className="px-2 bg-emerald-50/30 text-emerald-700 font-bold font-mono">{r.step3}%</td>

                                                <td className="px-2 text-indigo-400 font-bold font-mono">{r.exposedRate}%</td>

                                                <td className="px-2 bg-green-50/30 text-green-700 font-black font-mono">{r.paid}</td>

                                            </tr>

                                        )) : <tr><td colSpan="8" className="py-10 text-center text-slate-400 font-sans">데이터가 없습니다.</td></tr>}

                                    </tbody>

                                </table>

                            </div>

                        </div>

                    </div>

                    )}

                </div>

            );

        }



        const rootElement = document.getElementById('root');

        if (ReactDOM.createRoot) {

            const root = ReactDOM.createRoot(rootElement);

            root.render(<App />);

        } else {

            ReactDOM.render(<App />, rootElement);

        }

    </script>

</body>

</html>
